name: hetzner-watch
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: hetzner_state.json, key: hz-${{ github.run_id }}, restore-keys: hz-}
      - run: python3 hetzner_watch.py
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
